<title>황야의 총잡이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
/* 한 화면 게임: 해 질 녘 황야 한 장면만 쓰는 단일 테마(어두운 테두리 + 캔버스) */
:root {
  --frame: #22150f;
  --ink: #fff4e2;
  --focus: #f6c453;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; background: var(--frame); }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--frame); color: var(--ink);
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
canvas { display: block; touch-action: none; outline: none; }
canvas:focus-visible { outline: 2px solid var(--focus); }
</style>
<div id="wrap"><canvas id="c" tabindex="0" aria-label="황야의 총잡이 게임 화면"></canvas></div>
<script>
'use strict';
/* =========================================================================
   황야의 총잡이 — 세로 화면 망루 사수(직접 조준 슈팅 디펜스)
   망루 위 총잡이가 골짜기로 몰려오는 무법자들을 직접 조준해 쏜다.
   - 화면 어디서나 끌면 조준점 이동, 손을 떼면 발사
   - 스코프 버튼: 확대 조준(거리 m 표시, 약간 흔들림)
   - 머리 = 헤드샷(2.5배), 철갑 마차는 화약통이 약점(3배, 방어 무시)
   - 저격수가 반짝이면 곧 쏜다 → 먼저 맞히면 조준이 끊긴다
   - 날아오는 다이너마이트도 쏘아 맞히면 공중에서 터진다
   - 장전 중 노란 칸에서 탭 = 완벽 장전, 레벨업마다 기술 카드 3장 중 1장
   모든 수치는 CFG / ENEMY / CARDS / PERMS 에 모여 있다.
   ========================================================================= */
const W = 540, H = 960;
const HORIZON = 318, K = 940, CAM_H = 4.1;       // 원근: 거리 z(m) 에서 1m = K/z px
const Z_SPAWN = 118, Z_WALL = 9.5, MAX_WAVE = 20;
const SCOPE_CY = 420, SCOPE_R = 232;
const FONT_UI = "'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
const FONT_TITLE = "'Black Han Sans', 'Jua', 'Apple SD Gothic Neo', sans-serif";

const CFG = {
  dmg: 30, headMul: 2.5, weakMul: 3, mag: 6, cock: 0.42, reload: 1.6,
  assist: 7, zoom: 2.6, sway: 2.4, aimSens: 1.25,
  hp: 150, waveRepair: 0.08,
  perfectZone: [0.42, 0.66], perfectBonus: 0.5, jamPenalty: 0.5,
  fanShots: 6, fanKills: 22,
  xpNeed: lvl => 3 + lvl * 3,
};

// 적: hp 는 1웨이브 기준(웨이브마다 hpScale 곱함), spd 는 m/s, h·w 는 m
const ENEMY = {
  bandit: { name: '무법자',     hp: 40,  spd: 3.4, h: 1.8,  w: 0.62, melee: 5,  xp: 1, gold: 1, body: '#5a4a6b', hat: '#3a2a22', scarf: '#b8322a' },
  rider:  { name: '기마 무법자', hp: 38,  spd: 7.2, h: 1.8,  w: 0.62, melee: 6,  xp: 2, gold: 2, mount: true, body: '#7a3b2e', hat: '#2a1e1a', scarf: '#e0b040' },
  rifle:  { name: '저격수',     hp: 40,  spd: 3.0, h: 1.8,  w: 0.62, shot: 9,   xp: 2, gold: 2, ranged: true, body: '#3f5a4a', hat: '#5b3a22', scarf: '#2c2528' },
  dyna:   { name: '폭파범',     hp: 34,  spd: 4.0, h: 1.75, w: 0.62, bomb: 16,  xp: 2, gold: 2, thrower: true, body: '#8a5a2a', hat: '#a33b2b', scarf: '#f2c14e' },
  brute:  { name: '덩치',       hp: 170, spd: 2.3, h: 2.15, w: 0.95, melee: 12, xp: 4, gold: 4, armor: 6, body: '#4a3a32', hat: '#1f1a1c', scarf: '#6b8f9a' },
  boss:   { name: '검은 모자',   hp: 900, spd: 2.0, h: 2.4,  w: 1.0,  melee: 20, shot: 14, xp: 20, gold: 40, armor: 4, boss: true, ranged: true, body: '#26201f', hat: '#111014', scarf: '#c0392b' },
  wagon:  { name: '철갑 마차',   hp: 1200, spd: 1.6, h: 2.6, w: 3.2,  melee: 25, shot: 10, xp: 25, gold: 50, armor: 10, boss: true, wagon: true },
};
const SPAWN_POOL = [ // [종류, 예산 비용, 등장 웨이브]
  ['bandit', 1, 1], ['rider', 2, 2], ['rifle', 2, 3], ['dyna', 2, 5], ['brute', 3, 7],
];
const BOSS_WAVES = { 5: ['boss', '검은 모자'], 10: ['wagon', '철갑 마차'], 15: ['boss', '검은 모자 형님'], 20: ['wagon', '개틀링 마차'] };
const hpScale = n => 1 + 0.13 * (n - 1) + 0.005 * (n - 1) * (n - 1);

// 레벨업 기술 카드
const CARDS = [
  { id: 'power',  glyph: '힘', col: '#d9573b', name: '묵직한 탄',     desc: '총알 피해 +25%',             max: 6, apply: p => { p.dmgMul += 0.25; } },
  { id: 'cock',   glyph: '속', col: '#e08a2e', name: '빠른 레버',     desc: '다음 발까지 시간 -18%',        max: 5, apply: p => { p.cock *= 0.82; } },
  { id: 'mag',    glyph: '탄', col: '#b8862b', name: '큰 탄창',       desc: '탄창 +3발',                  max: 5, apply: p => { p.mag += 3; p.ammo += 3; } },
  { id: 'reload', glyph: '장', col: '#5f8f4e', name: '번개 장전',     desc: '장전 시간 -25%',             max: 4, apply: p => { p.reloadTime *= 0.75; } },
  { id: 'head',   glyph: '머', col: '#c2416b', name: '명사수',       desc: '헤드샷 배율 +0.75',           max: 4, apply: p => { p.headMul += 0.75; } },
  { id: 'pierce', glyph: '관', col: '#4f7fa6', name: '관통탄',       desc: '겹친 적을 1명 더 꿰뚫음',       max: 3, apply: p => { p.pierce++; } },
  { id: 'explo',  glyph: '폭', col: '#a33b2b', name: '폭발탄',       desc: '맞은 자리 주변에 폭발 피해',     max: 3, apply: p => { p.explo++; } },
  { id: 'assist', glyph: '넓', col: '#3f9a92', name: '매의 눈',       desc: '맞는 판정 범위 +40%',          max: 3, apply: p => { p.assistMul += 0.4; } },
  { id: 'scope',  glyph: '경', col: '#7a5aa8', name: '좋은 망원경',   desc: '스코프 배율 +0.6, 흔들림 -30%', max: 3, apply: p => { p.zoom += 0.6; p.swayMul *= 0.7; } },
  { id: 'buddy',  glyph: '조', col: '#8a6a3c', name: '조수 저격수',   desc: '가장 가까운 적을 대신 쏴 줌',   max: 4, apply: p => { p.buddy++; } },
  { id: 'tnt',    glyph: '약', col: '#c0392b', name: '다이너마이트 지원', desc: '7초마다 적 무리에 폭탄',     max: 4, apply: p => { p.tnt++; } },
  { id: 'wall',   glyph: '벽', col: '#9b6b3c', name: '모래주머니',     desc: '최대 체력 +30, 전부 수리',     max: 5, apply: (p, g) => { g.hpMax += 30; g.hp = g.hpMax; } },
  { id: 'bounty', glyph: '금', col: '#c9a227', name: '현상금 사냥꾼',  desc: '이번 판 금화 +30%',          max: 3, apply: p => { p.goldMul += 0.3; } },
  { id: 'heal',   glyph: '수', col: '#6c8f3a', name: '보급 마차',     desc: '망루 체력 60 회복',           max: 99, apply: (p, g) => { g.hp = Math.min(g.hpMax, g.hp + 60); } },
];

// 판 사이 영구 강화 (금화)
const PERMS = [
  { id: 'dmg',  name: '은 탄환',      desc: '총알 피해 +10%',   max: 10, cost: l => Math.round(40 * Math.pow(1.45, l)) },
  { id: 'hp',   name: '튼튼한 망루',   desc: '망루 체력 +20',    max: 10, cost: l => Math.round(30 * Math.pow(1.45, l)) },
  { id: 'luck', name: '행운의 편자',   desc: '금화 +15%',        max: 10, cost: l => Math.round(50 * Math.pow(1.5, l)) },
];

/* ----------------------------- 저장 ----------------------------- */
const SAVE_KEY = 'gunslinger_defense_v2';
let save = { gold: 0, best: 0, wins: 0, muted: false, perm: { dmg: 0, hp: 0, luck: 0 } };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (s) save = Object.assign(save, s, { perm: Object.assign({ dmg: 0, hp: 0, luck: 0 }, s.perm || {}) });
} catch (e) { /* 저장소가 막혀 있으면 새로 시작 */ }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ----------------------------- 화면 ----------------------------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
function resize() {
  const vw = wrap.clientWidth || innerWidth, vh = wrap.clientHeight || innerHeight;
  const s = Math.min(vw / W, vh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.max(1, Math.floor(W * s * dpr));
  cv.height = Math.max(1, Math.floor(H * s * dpr));
}
addEventListener('resize', resize);
resize();
const baseTransform = () => ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const d2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
const proj = (x, z) => { const s = K / z; return [W / 2 + x * s, HORIZON + CAM_H * s, s]; };
const groundZ = y => (y > HORIZON + 1 ? CAM_H * K / (y - HORIZON) : Infinity);

/* ----------------------------- 소리 (Web Audio 합성) ----------------------------- */
let ac = null, noiseBuf = null;
function audioUnlock() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.8, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
}
function noise(dur, freq, q, vol, type, delay) {
  if (!ac || save.muted) return;
  const t = ac.currentTime + (delay || 0), src = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
  src.buffer = noiseBuf; f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(gn); gn.connect(ac.destination); src.start(t); src.stop(t + dur + 0.02);
}
function tone(f0, f1, dur, vol, type, delay) {
  if (!ac || save.muted) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), gn = ac.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  shot() { noise(0.35, 900, 0.5, 0.45, 'lowpass'); noise(0.08, 2600, 0.8, 0.25); tone(180, 50, 0.18, 0.18, 'triangle'); },
  lever() { tone(1500, 1300, 0.03, 0.06, 'square', 0.12); tone(1100, 900, 0.03, 0.06, 'square', 0.2); },
  head() { tone(1600, 1200, 0.06, 0.08, 'square'); tone(2400, 2400, 0.08, 0.05, 'triangle', 0.04); },
  hit() { tone(700, 400, 0.05, 0.06, 'square'); },
  metal() { tone(2200, 1800, 0.08, 0.06, 'triangle'); },
  miss() { noise(0.1, 3000, 1, 0.05); },
  kill() { noise(0.15, 500, 1.2, 0.12); },
  reload() { tone(1800, 1600, 0.025, 0.06, 'square'); tone(1400, 1200, 0.025, 0.06, 'square', 0.08); tone(1600, 1400, 0.025, 0.06, 'square', 0.16); },
  perfect() { tone(880, 880, 0.07, 0.08, 'triangle'); tone(1320, 1320, 0.12, 0.08, 'triangle', 0.07); },
  jam() { tone(160, 90, 0.18, 0.12, 'sawtooth'); },
  hurt() { noise(0.18, 260, 1.2, 0.25); tone(120, 70, 0.15, 0.1, 'sawtooth'); },
  enemyShot() { noise(0.12, 1800, 0.8, 0.12); },
  glint() { tone(2600, 2600, 0.06, 0.03, 'sine'); },
  boom() { noise(0.6, 160, 0.6, 0.5, 'lowpass'); tone(100, 35, 0.45, 0.22, 'sine'); },
  level() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.12, 0.07, 'triangle', i * 0.07)); },
  wave() { tone(392, 392, 0.12, 0.06, 'triangle'); tone(523, 523, 0.2, 0.06, 'triangle', 0.12); },
  boss() { tone(110, 90, 0.6, 0.18, 'sawtooth'); tone(82, 70, 0.7, 0.14, 'sawtooth', 0.25); },
  lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, f * 0.98, 0.22, 0.08, 'triangle', i * 0.2)); },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 0.08, 'triangle', i * 0.12)); },
  click() { tone(700, 600, 0.04, 0.05, 'square'); },
  scope() { tone(500, 900, 0.06, 0.04, 'sine'); },
};

/* ----------------------------- 게임 상태 ----------------------------- */
let scene = 'title';      // title | play | levelup | pause | over | win
let g = null, p = null;
let cardChoices = [];
let uiButtons = [];
let titleT = 0;

function newPlayer() {
  return {
    cx: W / 2, cy: 470,                     // 조준점 (확대 전 화면 좌표)
    scoped: false, zc: 1, zoom: CFG.zoom, swayMul: 1, assistMul: 1,
    dmgMul: 1 + 0.1 * save.perm.dmg, headMul: CFG.headMul, mag: CFG.mag, ammo: CFG.mag,
    cock: CFG.cock, cockT: 0, reloadTime: CFG.reload, reloading: -1, reloadTried: false, hotShots: 0,
    pierce: 0, explo: 0, buddy: 0, buddyCd: 2, tnt: 0, tntCd: 4,
    goldMul: 1 + 0.15 * save.perm.luck, recoil: 0, flash: 0,
    fanCharge: 0, fanLeft: 0, fanCd: 0, cards: {},
  };
}
function newGame() {
  p = newPlayer();
  const hpMax = CFG.hp + 20 * save.perm.hp;
  g = {
    wave: 0, phase: 'banner', bannerT: 0, queue: [], spawnT: 0, spawnGap: 1,
    enemies: [], bombs: [], parts: [], texts: [], tracers: [],
    hp: hpMax, hpMax, hurtT: 0, xp: 0, lvl: 1, pendingLv: 0,
    kills: 0, heads: 0, shots: 0, hits: 0, gold: 0, time: 0, shake: 0, slowT: 0,
    boss: null, msg: null, waveTotal: 1,
  };
  nextWave();
  scene = 'play';
}
function buildWave(n) {
  const q = [];
  let budget = Math.round(5 + n * 2.4);
  while (budget > 0) {
    const opts = SPAWN_POOL.filter(s => s[2] <= n && s[1] <= budget);
    if (!opts.length) break;
    const s = Math.random() < 0.3 ? opts[0] : opts[(Math.random() * opts.length) | 0];
    q.push(s[0]); budget -= s[1];
  }
  if (BOSS_WAVES[n]) q.splice(Math.floor(q.length * 0.25), 0, 'BOSS');
  return q;
}
function nextWave() {
  g.wave++;
  g.queue = buildWave(g.wave);
  g.waveTotal = g.queue.length;
  g.spawnGap = Math.max(0.55, 1.7 - g.wave * 0.06);
  g.spawnT = 0.3;
  g.phase = 'banner'; g.bannerT = 2.2;
  g.boss = null;
  sfx.wave();
}
function spawn(kind) {
  let type = kind, bossName = null;
  if (kind === 'BOSS') { [type, bossName] = BOSS_WAVES[g.wave]; }
  const def = ENEMY[type];
  const x0 = rand(-10, 10);
  const e = {
    type, def, x: x0, x0, xt: rand(-2.2, 2.2), z: Z_SPAWN + rand(0, 6), state: 'walk',
    hp: def.hp * hpScale(g.wave), maxHp: 0, spd: def.spd * (1 + Math.min(0.2, g.wave * 0.01)),
    t: rand(0, 6), seed: Math.random() * 100, hitT: 0, atkT: rand(0.2, 0.8), aimT: 0, armor: def.armor || 0,
    stopZ: def.ranged ? rand(42, 70) : def.thrower ? rand(20, 27) : Z_WALL, dead: false, dieT: 0,
  };
  if (def.boss) {
    const bi = g.wave / 5;
    e.hp = def.hp * (1 + 0.3 * (bi - 1));
    e.x0 = e.x = rand(-3, 3); e.xt = rand(-1, 1);
    e.name = bossName; e.gatling = g.wave >= 20; e.summon = g.wave >= 15 && type === 'boss';
    e.summonCd = 6;
    if (def.wagon) e.stopZ = Z_WALL + 1.5;
    if (type === 'boss') e.stopZ = rand(30, 40);
    g.boss = e;
    sfx.boss();
    flashMsg(e.name + ' 등장!', '#ffd76a');
  }
  e.maxHp = e.hp;
  g.enemies.push(e);
  return e;
}
function flashMsg(text, col) { g.msg = { text, col: col || '#fff4e2', t: 1.6 }; }

/* ----------------------------- 판정 ----------------------------- */
function alive(e) { return !e.dead && e.z < Z_SPAWN; }
// 적의 화면 위 부위들 (확대 전 좌표)
function parts(e) {
  const [sx, gy, s] = proj(e.x, e.z);
  const d = e.def;
  if (d.wagon) {
    const w = d.w * s, h = d.h * s;
    return { sx, gy, s, body: [sx - w / 2, gy - h, w, h - 0.35 * s], weak: [sx - 0.85 * s, gy - 1.05 * s, 0.42 * s] };
  }
  const lift = d.mount ? 1.05 * s : 0;
  const bob = e.state === 'walk' ? Math.abs(Math.sin(e.t * (d.mount ? 9 : 7))) * 0.05 * s : 0;
  const top = gy - lift - d.h * s - bob;
  const hr = 0.14 * s * (d.h / 1.8);
  const r = { sx, gy, s, lift, top, head: [sx, top + hr * 1.25, hr], body: [sx - d.w * s / 2, top + hr * 2.3, d.w * s, d.h * s - hr * 2.3] };
  if (d.mount) r.horse = [sx - 1.0 * s, gy - 1.45 * s, 2.0 * s, 1.45 * s];
  return r;
}
function hitTest(e, ax, ay, assist) {
  const P = parts(e);
  if (P.weak && d2(ax, ay, P.weak[0], P.weak[1]) <= (P.weak[2] + assist * 0.4) ** 2) return 'weak';
  if (P.head && d2(ax, ay, P.head[0], P.head[1]) <= (P.head[2] + assist * 0.35) ** 2) return 'head';
  const b = P.body;
  if (ax >= b[0] - assist && ax <= b[0] + b[2] + assist && ay >= b[1] - assist * 0.5 && ay <= b[1] + b[3] + assist * 0.5) return 'body';
  if (P.horse) { const h = P.horse; if (ax >= h[0] - assist * 0.5 && ax <= h[0] + h[2] + assist * 0.5 && ay >= h[1] && ay <= h[1] + h[3]) return 'horse'; }
  return null;
}
function aimPoint() {
  if (!p.scoped) return [p.cx, p.cy];
  const a = CFG.sway * p.swayMul;
  return [p.cx + Math.sin(g.time * 1.3) * a, p.cy + Math.sin(g.time * 1.9 + 1) * a * 0.7];
}
function underAim() {
  const [ax, ay] = aimPoint();
  const assist = CFG.assist * p.assistMul / p.zc;
  const list = g.enemies.filter(alive).sort((a, b) => a.z - b.z);
  for (const e of list) { const part = hitTest(e, ax, ay, assist); if (part) return [e, part]; }

}

/* ----------------------------- 사격 ----------------------------- */
function canFire() { return p.reloading < 0 && p.cockT <= 0 && p.ammo > 0; }
function fire() {
  if (!canFire()) return false;
  p.ammo--; p.cockT = p.cock; g.shots++;
  const [ax, ay] = aimPoint();
  const assist = CFG.assist * p.assistMul / p.zc;
  const hot = p.hotShots > 0;
  if (hot) p.hotShots--;
  const base = CFG.dmg * p.dmgMul * (hot ? 1 + CFG.perfectBonus : 1);
  let hitAny = false;
  // 날아오는 다이너마이트 맞히기
  for (const b of g.bombs) {
    if (b.owner !== 'enemy' || b.done) continue;
    const [bx, by] = bombScreen(b);
    if (d2(ax, ay, bx, by) <= (16 / p.zc + assist) ** 2) {
      b.done = true; hitAny = true;
      const [x, z] = bombWorld(b);
      explode(x, z, 3.2, 80 * p.dmgMul, true, by);
      flashMsg('공중 폭파!', '#ffd76a');
    }
  }
  if (!hitAny) {
    let pierceLeft = p.pierce;
    const list = g.enemies.filter(alive).sort((a, b) => a.z - b.z);
    for (const e of list) {
      const part = hitTest(e, ax, ay, assist);
      if (!part) continue;
      hitAny = true;
      let mul = 1, ignoreArmor = false;
      if (part === 'head') mul = p.headMul;
      else if (part === 'weak') { mul = CFG.weakMul; ignoreArmor = true; }
      else if (part === 'horse') mul = 0.8;
      hurt(e, base * mul, part, ignoreArmor, ax, ay);
      if (p.explo > 0) explode(e.x, e.z, 1.2 + 0.5 * p.explo, base * 0.35 * p.explo, false);
      if (pierceLeft-- <= 0) break;
    }
  }
  if (hitAny) g.hits++;
  else {
    sfx.miss();
    for (let i = 0; i < 6; i++) g.parts.push({ x: ax, y: ay, vx: rand(-40, 40), vy: rand(-70, -10), life: 0.5, max: 0.5, r: rand(1.5, 3.5) / Math.max(1, p.zc * 0.6), col: '#d9b98a' });
  }
  g.tracers.push({ x: ax, y: ay, t: 0.07 });
  p.recoil = 1; p.flash = 0.06; g.shake = Math.max(g.shake, 0.12);

}
function startReload() { if (p.reloading < 0 && p.ammo < p.mag) { p.reloading = 0; p.reloadTried = false; } }
function hurt(e, dmg, part, ignoreArmor, hx, hy) {
  if (e.dead) return;
  const real = Math.max(1, dmg - (ignoreArmor ? 0 : e.armor));
  e.hp -= real; e.hitT = 0.1;
  if (e.def.ranged && e.state === 'aim' && part) { e.aimT = Math.min(e.aimT, -0.8); } // 맞으면 조준이 끊김
  const P = parts(e);
  const tx = hx != null ? hx : P.sx, ty = hy != null ? hy : (P.top || P.gy - 40);
  const big = part === 'head' || part === 'weak';
  g.texts.push({ x: tx + rand(-6, 6), y: ty - 8, text: String(Math.round(real)), col: big ? '#ffdf4a' : '#fff4e2', size: big ? 28 : 20, t: 0.7, vy: -46 });
  if (part === 'head') { g.texts.push({ x: tx, y: ty - 34, text: '헤드샷!', col: '#ff6a4a', size: 22, t: 0.8, vy: -30 }); sfx.head(); }
  else if (part === 'weak') { g.texts.push({ x: tx, y: ty - 34, text: '약점!', col: '#ff6a4a', size: 22, t: 0.8, vy: -30 }); sfx.head(); }
  else if (part) { if (e.def.wagon || e.armor >= 6) sfx.metal(); else sfx.hit(); }
  for (let i = 0; i < 5; i++) g.parts.push({ x: tx, y: ty, vx: rand(-60, 60), vy: rand(-80, 20), life: 0.25, max: 0.25, r: rand(1, 2.5), col: '#fff1c0' });
  if (e.hp <= 0) kill(e, part);
}
function kill(e, part) {
  e.dead = true; e.dieT = 0.7; e.dir = Math.random() < 0.5 ? -1 : 1;
  g.kills++;
  if (part === 'head') g.heads++;
  g.xp += e.def.xp;
  const gold = e.def.gold * p.goldMul * (part === 'head' ? 1.5 : 1);
  g.gold += gold;
  p.fanCharge = Math.min(1, p.fanCharge + (e.def.boss ? 0.5 : 1 / CFG.fanKills));
  const P = parts(e);
  g.texts.push({ x: P.sx, y: P.gy - 10, text: '+' + Math.max(1, Math.round(gold)), col: '#f6c453', size: 16, t: 0.8, vy: -30 });
  if (part === 'head' && !e.def.wagon) { e.hatOff = { x: 0, y: 0, vx: rand(-40, 40) * e.dir, vy: -160, r: 0 }; g.slowT = Math.max(g.slowT, 0.16); }
  for (let i = 0; i < (e.def.boss ? 40 : 10); i++) {

    g.parts.push({ x: P.sx, y: P.gy - P.s * 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: rand(0.3, 0.7), max: 0.7, r: rand(1.5, 4) * Math.min(2, P.s / 30), col: i % 3 ? '#c99a5e' : '#8a5a33' });
  }
  if (e.def.boss) { g.shake = 0.5; g.slowT = 1.0; sfx.boom(); flashMsg(e.name + ' 쓰러뜨림!', '#ffd76a'); g.boss = null; }
  else sfx.kill();

}
function explode(x, z, radius, dmg, byPlayer, screenY) {
  if (byPlayer !== 'enemyOnly') {
    for (const e of g.enemies) {
      if (!alive(e)) continue;
      const rr = radius + (e.def.wagon ? 1.6 : 0.3);
      if ((e.x - x) ** 2 + (e.z - z) ** 2 < rr * rr) hurt(e, dmg, null, false);
    }
  }
  const [sx, gy, s] = proj(x, z);
  const cy = screenY != null ? screenY : gy - s * 0.4;
  for (let i = 0; i < 26; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(40, 180) * Math.min(2.2, s / 25);
    g.parts.push({ x: sx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20, life: rand(0.3, 0.7), max: 0.7, r: rand(2, 6) * Math.min(2, s / 25), col: i % 2 ? '#ff9a3c' : '#ffd76a' });
  }
  g.parts.push({ x: sx, y: cy, ring: true, life: 0.35, max: 0.35, r: radius * s });

}
function bestCluster(radius) {
  let best = null, bc = 0;

    if (!alive(e) || e.z > 100) continue;
    let c = 0;
    for (const o of g.enemies) if (alive(o) && (o.x - e.x) ** 2 + (o.z - e.z) ** 2 < radius * radius) c += o.def.boss ? 4 : 1;
    if (c > bc) { bc = c; best = e; }

}
function damagePlayer(dmg) {

}
// 다이너마이트 위치 (x,z 를 따라가며 높이 h 로 포물선)
function bombWorld(b) { const k = clamp(b.t / b.dur, 0, 1); return [lerp(b.x0, b.x1, k), lerp(b.z0, b.z1, k), Math.sin(k * Math.PI) * b.arc]; }
function bombScreen(b) { const [x, z, h] = bombWorld(b); const [sx, gy, s] = proj(x, z); return [sx, gy - (h + 1.2) * s, s]; }

/* ----------------------------- 업데이트 ----------------------------- */
function update(rdt) {
  if (g.slowT > 0) g.slowT -= rdt;
  const dt = rdt * (g.slowT > 0 ? 0.3 : 1);
  g.time += dt;
  if (g.shake > 0) g.shake -= rdt;
  if (g.hurtT > 0) g.hurtT -= rdt;
  if (g.msg && (g.msg.t -= rdt) <= 0) g.msg = null;

  // 웨이브 진행
  if (g.phase === 'banner') {
    g.bannerT -= dt;
    if (g.bannerT <= 0) g.phase = 'fight';
  } else if (g.phase === 'fight') {
    if (g.queue.length) {
      g.spawnT -= dt;
      if (g.spawnT <= 0) { spawn(g.queue.shift()); g.spawnT = g.spawnGap * rand(0.6, 1.4); }
    } else if (!g.enemies.length && !g.bombs.length) {
      if (g.wave >= MAX_WAVE) { endGame(true); return; }
      const rep = Math.round(g.hpMax * CFG.waveRepair);
      g.hp = Math.min(g.hpMax, g.hp + rep);
      const bonus = Math.round((5 + g.wave * 2) * p.goldMul);
      g.gold += bonus;
      flashMsg('웨이브 ' + g.wave + ' 막아냄!  금화 +' + bonus, '#f6c453');
      nextWave();
    }
  }

  // 총잡이
  p.zc += ((p.scoped ? p.zoom : 1) - p.zc) * Math.min(1, rdt * 14);
  if (Math.abs(p.zc - (p.scoped ? p.zoom : 1)) < 0.01) p.zc = p.scoped ? p.zoom : 1;
  p.recoil = Math.max(0, p.recoil - rdt * 6);
  p.flash -= rdt;
  p.cockT -= dt;
  if (p.reloading >= 0) {
    p.reloading += dt;
    if (p.reloading >= p.reloadTime) { p.reloading = -1; p.ammo = p.mag; sfx.reload(); }
  }
  // 난사: 가까운 적 머리에 차례로 자동 명중
  if (p.fanLeft > 0) {
    p.fanCd -= dt;
    while (p.fanLeft > 0 && p.fanCd <= 0) {
      const list = g.enemies.filter(alive).sort((a, b) => a.z - b.z);
      if (!list.length) { p.fanLeft = 0; break; }
      const e = list[0];
      const P = parts(e);
      const pt = P.weak || P.head;
      hurt(e, CFG.dmg * p.dmgMul * (P.weak ? CFG.weakMul : p.headMul), P.weak ? 'weak' : 'head', !!P.weak, pt[0], pt[1]);
      g.tracers.push({ x: pt[0], y: pt[1], t: 0.06 });
      sfx.shot(); p.recoil = 1; p.flash = 0.05;

    }
  }
  // 조수 저격수
  if (p.buddy > 0) {
    p.buddyCd -= dt;
    if (p.buddyCd <= 0) {
      const list = g.enemies.filter(e => alive(e) && e.z < 90).sort((a, b) => a.z - b.z);
      if (list.length) {
        const e = list[0], P = parts(e);
        const bx = P.body[0] + P.body[2] / 2, by = P.body[1] + P.body[3] * 0.4;
        hurt(e, CFG.dmg * 0.8 * p.dmgMul, 'body', false, bx, by);
        g.tracers.push({ x: bx, y: by, t: 0.06, buddy: true });
        noise(0.15, 1200, 0.6, 0.15);
        p.buddyCd = Math.max(0.9, 2.8 - 0.45 * p.buddy);
      } else p.buddyCd = 0.3;
    }
  }
  // 다이너마이트 지원
  if (p.tnt > 0) {
    p.tntCd -= dt;
    if (p.tntCd <= 0) {
      const radius = 2.4 + 0.5 * p.tnt;
      const t = bestCluster(radius);
      if (t) {
        const lead = Math.min(1.1, t.spd * 1.0);
        g.bombs.push({ owner: 'player', x0: 0, z0: Z_WALL - 2, x1: t.x, z1: Math.max(Z_WALL + 1, t.z - lead), t: 0, dur: 1.0, arc: 7, radius, dmg: (40 + 20 * p.tnt) * p.dmgMul });
        p.tntCd = 7;
      } else p.tntCd = 0.6;
    }
  }
  for (const b of g.bombs) {
    if (b.done) continue;
    b.t += dt;
    if (b.t >= b.dur) {
      b.done = true;
      if (b.owner === 'player') explode(b.x1, b.z1, b.radius, b.dmg, true);
      else { explode(b.x1, b.z1, 1, 0, 'enemyOnly'); damagePlayer(b.dmg); }
    }
  }
  g.bombs = g.bombs.filter(b => !b.done);

  // 적
  for (const e of g.enemies) {
    if (e.dead) { e.dieT -= dt; if (e.hatOff) { const h = e.hatOff; h.x += h.vx * dt; h.y += h.vy * dt; h.vy += 420 * dt; h.r += dt * 8 * e.dir; } continue; }
    e.t += dt; e.hitT -= dt;

    if (e.state === 'walk') {
      e.z -= e.spd * dt;
      const prog = clamp((Z_SPAWN - e.z) / (Z_SPAWN - Z_WALL), 0, 1);
      const sm = prog * prog * (3 - 2 * prog);
      e.x = lerp(e.x0, e.xt, sm) + (d.mount ? Math.sin(e.t * 1.4 + e.seed) * 1.6 * (1 - prog) : 0);

      }
      if (e.z <= e.stopZ) {
        e.z = e.stopZ;
        e.state = d.ranged ? 'aim' : d.thrower ? 'throw' : 'melee';
        e.aimT = d.ranged ? -0.6 : 0; e.atkT = d.thrower ? 0.8 : 0.3;
      }
    } else if (e.state === 'melee') {
      e.atkT -= dt;
      if (e.atkT <= 0) { e.atkT = d.wagon ? 1.6 : 1.1; damagePlayer(d.melee * scale); e.lunge = 0.18; }
      if (e.lunge > 0) e.lunge -= dt;

    } else if (e.state === 'aim') {
      // 반짝임(조준) → 발사 → 쉬었다가 다시 조준. 맞으면 조준이 끊김.
      const before = e.aimT;
      e.aimT += dt;
      if (before < 0 && e.aimT >= 0) sfx.glint();
      if (e.aimT >= 1.8) {
        e.aimT = -rand(2.2, 3.2);
        damagePlayer(d.shot * scale);
        e.gunT = 0.15;
        sfx.enemyShot();
      }
      if (e.gunT > 0) e.gunT -= dt;
      if (d.boss && e.summon) {
        e.summonCd -= dt;
        if (e.summonCd <= 0) { e.summonCd = 8; for (let k = 0; k < 1; k++) { const m = spawn('rider'); m.z = e.z + 4; m.x0 = m.x = e.x + (k ? 2 : -2); } }
      }
      // 보스는 쏘면서도 천천히 다가온다
      if (d.boss) { e.z = Math.max(Z_WALL, e.z - 0.35 * dt); if (e.z <= Z_WALL + 0.01) e.state = 'melee'; }
    } else if (e.state === 'throw') {
      e.atkT -= dt;
      if (e.atkT <= 0) {
        e.atkT = rand(3.5, 4.5);
        g.bombs.push({ owner: 'enemy', x0: e.x, z0: e.z - 0.3, x1: e.x * 0.4, z1: Z_WALL - 0.5, t: 0, dur: 1.5, arc: 4.5, dmg: d.bomb * scale });
        e.throwAnim = 0.3;
      }
      if (e.throwAnim > 0) e.throwAnim -= dt;
    }
    if (d.wagon && e.gatling && e.state === 'walk' && e.z < 60) gatling(e, dt, scale);
  }
  g.enemies = g.enemies.filter(e => !e.dead || e.dieT > 0);

  for (const q of g.parts) { q.life -= dt; if (!q.ring) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 200 * dt; } }

  if (g.parts.length > 500) g.parts.splice(0, g.parts.length - 500);
  for (const t of g.texts) { t.t -= rdt; t.y += t.vy * rdt; }

  for (const t of g.tracers) t.t -= rdt;
  g.tracers = g.tracers.filter(t => t.t > 0);

  if (g.pendingLv > 0 && scene === 'play' && g.slowT <= 0) openLevelUp();
}
function gatling(e, dt, scale) {

    e.gunT = 0.08;

/* ----------------------------- 레벨업 / 끝 ----------------------------- */
function openLevelUp() {
  const avail = CARDS.filter(c => c.id !== 'heal' && (p.cards[c.id] || 0) < c.max);
  for (let i = avail.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [avail[i], avail[j]] = [avail[j], avail[i]]; }
  cardChoices = avail.slice(0, 3);
  const heal = CARDS.find(c => c.id === 'heal');
  if (g.hp < g.hpMax * 0.6 || cardChoices.length < 3) {
    if (cardChoices.length >= 3) cardChoices[2] = heal; else cardChoices.push(heal);
  }
  p.scoped = false; p.zc = 1;
  scene = 'levelup';
  drag = null;
  sfx.level();
}
function chooseCard(i) {
  const c = cardChoices[i];
  if (!c) return;
  p.cards[c.id] = (p.cards[c.id] || 0) + 1;
  c.apply(p, g);
  g.pendingLv--; g.lvl++;
  flashMsg(c.name + ' 획득!', c.col);
  sfx.click();
  if (g.pendingLv > 0) openLevelUp(); else scene = 'play';
}
function endGame(won) {
  const earned = Math.floor(g.gold) + (won ? 150 : 0);
  g.earned = earned;
  save.gold += earned;
  const reached = won ? MAX_WAVE : g.wave;
  g.newBest = reached > save.best;
  save.best = Math.max(save.best, reached);
  if (won) save.wins++;
  persist();
  p.scoped = false; p.zc = 1; drag = null;
  scene = won ? 'win' : 'over';
  if (won) sfx.win(); else sfx.lose();
}

/* ----------------------------- 입력 ----------------------------- */
function toGame(ev) {
  const r = cv.getBoundingClientRect();
  return [(ev.clientX - r.left) / r.width * W, (ev.clientY - r.top) / r.height * H];
}
const PAUSE_BTN = { x: W - 62, y: 14, w: 48, h: 48 };
const SCOPE_BTN = { x: 14, y: H - 132, w: 96, h: 96 };
const FAN_BTN = { x: W - 110, y: H - 132, w: 96, h: 96 };
let drag = null;
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  audioUnlock();
  cv.focus({ preventScroll: true });
  const [x, y] = toGame(ev);
  if (scene !== 'play') { for (const b of uiButtons) if (inRect(x, y, b)) { sfx.click(); b.act(); return; } return; }
  if (inRect(x, y, PAUSE_BTN)) { scene = 'pause'; p.scoped = false; p.zc = 1; sfx.click(); return; }
  if (inRect(x, y, SCOPE_BTN)) { toggleScope(); return; }
  if (inRect(x, y, FAN_BTN)) { useFan(); return; }
  if (drag) return; // 두 번째 손가락은 무시
  let noFire = false;
  if (p.reloading >= 0) { if (!p.reloadTried) tryActiveReload(); noFire = true; }
  drag = { id: ev.pointerId, lx: x, ly: y, noFire };
  try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
});
cv.addEventListener('pointermove', ev => {
  if (!drag || drag.id !== ev.pointerId || scene !== 'play') return;
  const [x, y] = toGame(ev);
  const k = p.scoped ? 1 / p.zc : CFG.aimSens;
  p.cx = clamp(p.cx + (x - drag.lx) * k, 8, W - 8);
  p.cy = clamp(p.cy + (y - drag.ly) * k, 150, 800);
  drag.lx = x; drag.ly = y;
});
cv.addEventListener('pointerup', ev => {
  if (!drag || drag.id !== ev.pointerId) return;
  const d = drag; drag = null;
  if (scene === 'play' && !d.noFire) fire();
});
cv.addEventListener('pointercancel', ev => { if (drag && drag.id === ev.pointerId) drag = null; });
cv.addEventListener('contextmenu', ev => ev.preventDefault());

function toggleScope() { p.scoped = !p.scoped; sfx.scope(); }
function useFan() {
  if (p.fanCharge < 1 || p.fanLeft > 0) return;
  p.fanCharge = 0; p.fanLeft = CFG.fanShots; p.fanCd = 0;
  flashMsg('난사!', '#ffd76a');
}
function tryActiveReload() {
  p.reloadTried = true;
  const f = p.reloading / p.reloadTime;
  if (f >= CFG.perfectZone[0] && f <= CFG.perfectZone[1]) {
    p.reloading = -1; p.ammo = p.mag; p.hotShots = p.mag;
    flashMsg('완벽 장전! 다음 탄창 피해 +50%', '#ffd76a');
    sfx.perfect();
  } else {
    p.reloading = Math.max(0, p.reloading - CFG.jamPenalty);
    flashMsg('철컥… 탄이 걸렸다', '#e8b4a0');
    sfx.jam();
  }
}
const held = {};
addEventListener('keydown', ev => {
  audioUnlock();
  held[ev.key] = true;

function edgeThreats() {
  // 스코프 밖에서 조준 중인 저격수 방향 표시
  if (!p.scoped) return;
  for (const e of g.enemies) {
    if (!alive(e) || !e.def.ranged || e.state !== 'aim' || e.aimT < 0) continue;
    const P = parts(e);
    const [vx, vy] = toView(P.sx, P.head[1]);
    const dx = vx - W / 2, dy = vy - SCOPE_CY, dd = Math.hypot(dx, dy);
    if (dd < SCOPE_R - 10) continue;

    ctx.fillStyle = e.aimT > 1.2 ? '#ff4a3a' : '#ffb03a';

  const t = p.zoom > 1 ? clamp((p.zc - 1) / (p.zoom - 1), 0, 1) : 0;
  const [ax, ay] = aimPoint();

}
function toView(x, y) { const v = viewParams(); return [v.ox + (x - v.ax) * v.z, v.oy + (y - v.ay) * v.z]; }

function drawWorld() {
  const v = viewParams();

  txt('쓰러뜨린 적 ' + g.kills + '  ·  헤드샷 ' + g.heads, W / 2, 386, 20, '#6a4430', 'center', FONT_UI);
  txt('명중률 ' + acc + '%  ·  레벨 ' + g.lvl, W / 2, 416, 20, '#6a4430', 'center', FONT_UI);
  coinIcon(W / 2 - 70, 462, 16);
  txt('+' + g.earned + (won ? ' (보너스 150 포함)' : ''), W / 2 - 46, 464, 24, '#3d2214', 'left', FONT_TITLE);
  if (g.newBest) txt('새 최고 기록!', W / 2, 516, 24, '#c0392b', 'center', FONT_TITLE);
  button(W / 2 - 130, 600, 260, 70, '다시 출발', newGame, { size: 30 });
  button(W / 2 - 130, 690, 260, 60, '잡화점으로', () => { scene = 'title'; }, { size: 24, col: '#4f7f6a' });
}

/* ----------------------------- 루프 ----------------------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  titleT += dt;
  if (scene === 'play') {
    const k = (p.scoped ? 160 / p.zc : 320) * dt;
    if (held.ArrowLeft || held.a) p.cx = clamp(p.cx - k, 8, W - 8);
    if (held.ArrowRight || held.d) p.cx = clamp(p.cx + k, 8, W - 8);
    if (held.ArrowUp || held.w) p.cy = clamp(p.cy - k, 150, 800);
    if (held.ArrowDown || held.s) p.cy = clamp(p.cy + k, 150, 800);
    update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
function render() {
  uiButtons = [];
  baseTransform();
  if (scene === 'title') { drawTitle(); return; }
  ctx.save();
  if (g.shake > 0 && scene === 'play') ctx.translate(rand(-3, 3) * g.shake * 4, rand(-3, 3) * g.shake * 4);
  drawWorld();
  const [te, part] = underAim();
  if (p.zc > 1.05) { drawScopeOverlay(!!te, part); edgeThreats(); }
  else {
    drawBarricade(g.hurtT > 0 ? rand(-2, 2) : 0);
    drawRifle();
    drawCrosshair(p.cx, p.cy, !!te, part);
  }
  ctx.restore();
  drawHud();
  if (scene === 'levelup') drawLevelUp();
  else if (scene === 'pause') drawPause();
  else if (scene === 'over') drawEnd(false);
  else if (scene === 'win') drawEnd(true);
}
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { bgCanvas = buildBg(); });

// 자동 시험용 고리 (게임 플레이에는 영향 없음)
window.__gd = {
  start: newGame, update, fire, chooseCard, useFan, toggleScope, tryActiveReload, parts, alive, render,
  get scene() { return scene; }, set scene(v) { scene = v; },
  get g() { return g; }, get p() { return p; }, get cards() { return cardChoices; }, save: () => save,
};
</script>
